<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Style Framework | Documentation</title>
  <link rel="stylesheet" href="./website/src/styles/website.scss" />
</head>
<body>
  <!-- TOP BAR -->
  <header class="topbar">
    <h1 class="topbar__title">M-System UI</h1>

    <div class="topbar__actions">
      <button id="themeToggle" class="mc-btn mc-btn--secondary">
        🌙 Oscuro
      </button>

      <select id="styleSelect" class="select">
      </select>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar__search">
        🔍
        <input type="text" placeholder="Buscar..." />
      </div>

      <nav class="nav">
        <a href="#">Inicio</a>
        <a href="#">Componentes</a>
        <a href="#">Botones</a>
        <a href="#">Cards</a>
        <a href="#">Documentación</a>
      </nav>
    </aside>

    <main class="content">
      <h2>Bienvenido</h2>
      <p>Panel de ejemplo con layout base.</p>
    </main>
  </div>

  <script type="module">
    import themeManifest from './src/themes/manifest.json';
    import './src/main.scss';

    const root = document.documentElement;
    const btn = document.getElementById('themeToggle');
    const paletteSelect = document.getElementById('styleSelect');
    const themes = themeManifest.themes;

    paletteSelect.replaceChildren(...themes.map((theme) => new Option(theme.label, theme.name)));
    root.dataset.palette = themes[0]?.name;

    paletteSelect.addEventListener('change', () => {
      root.dataset.palette = paletteSelect.value;
    });

    btn.addEventListener('click', () => {
      const isDark = root.dataset.theme
        ? root.dataset.theme === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;

      if (isDark) {
        root.dataset.theme = 'light';
        btn.textContent = '🌙 Modo Oscuro';
      } else {
        root.dataset.theme = 'dark';
        btn.textContent = '☀️ Modo Claro';
      }
    });
  </script>
</body>
</html>
